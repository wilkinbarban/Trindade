org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9.0 enables built-in Kotlin by default, which forbids applying the
# org.jetbrains.kotlin.android plugin this project uses. Opt out so the
# traditional Kotlin plugin setup remains valid.
android.builtInKotlin=false
# org.jetbrains.kotlin.android is not compatible with AGP 9.0's new variant
# DSL; fall back to the legacy DSL while that plugin is in use.
android.newDsl=false
