# The API level every Robolectric test in this module runs on, in one place.
#
# Pinned rather than inherited: Robolectric resolves an unpinned level from the merged manifest, so a
# future targetSdk bump would silently change what these tests run against -- and it downloads a
# different android-all image per level, so that change would arrive as a download and a new set of
# framework behaviours instead of as a decision. 35 is the level the app targets.
sdk=35
