name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run canonical CI gate
        run: bash scripts/ci.sh

  # A separate job, because the Node gate deliberately refuses to run outside Node 24 and this lane
  # needs a JDK. The same script runs locally through `make ci-android`, so the checks are one
  # implementation rather than two that drift.
  #
  # It runs *inside the SDK container* rather than on the runner's own toolchain, and that is not a
  # preference: the first version of this job assumed `ubuntu-latest` ships an Android SDK and died in
  # eight seconds with `sdkmanager: command not found`, before the lane was ever reached. The container
  # is the one the local lane and the release workflow already build with, and no third-party setup action
  # is needed to get an SDK. It is also what removed the three steps that used to stand here -- setting up a
  # JDK, accepting licences and installing a platform -- because that image carries all three already, and
  # the release build has since run in it and produced an APK, which is the proof it is enough.
  #
  # The image is pinned by digest, and what that buys is worth stating exactly, because an earlier version of
  # this comment claimed more than it had. A digest fixes the bytes: the steps below, which run the checkout
  # inside that image, get today's image tomorrow as well, and the job no longer depends on what a mutable
  # tag resolves to on the day it runs. It does not make the image trustworthy -- pinning a third party's
  # image is not the same act as auditing it -- and it does not freeze the toolchain for ever. The drift did
  # not disappear, it moved: it used to be the runner's toolchain changing underneath this file, and it is
  # now this line changing, which is a deliberate commit that has to be written, reviewed and explained.
  # The pin lives in three places -- this file, android-release.yml, and the two `docker run` invocations
  # in the Makefile's ci-android target -- and they move together: the local lane deliberately builds
  # against the same digest rather than the tag, so a commit cannot pass here and fail in CI against a
  # different toolchain, and an update is a deliberate act in all three. There is no shared mechanism for
  # a value that changes once or twice a year; the sentence in each file is the mechanism.
  # The image is also about 18 months old as of this pin, so it changes nothing about today's build and
  # everything about tomorrow's.
  android:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/android-sdk:35@sha256:c724009e305b4607157287624033ab97f319af44c244bfc9f73b6293f3bb01b9
    # A container job runs its steps with sh unless told otherwise, and the lane below is bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run the Android lane
        run: bash scripts/ci-android.sh
