server {
    listen 80;
    server_name _;

    client_max_body_size 10M;
    large_client_header_buffers 4 64k;

    # A policy of our own, so the document does not carry feature names Chrome no longer recognises
    # (run-ad-auction, join-ad-interest-group) or whatever a future dependency decides to inject. Only
    # the three capabilities this application never asks for are denied; anything unlisted stays at the
    # browser default. `always` so error responses carry it too.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass original Authorization header to the API
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # ---- Shortened public links proxy ----
    location /p/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static frontend ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
