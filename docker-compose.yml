# ============================================================
# Trindade Massas — Docker Compose
# ============================================================

services:
  # ---- Backend API ----
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - sqlite_data:/app/packages/backend/data    # SQLite DB + photos (data/photos/)
      # The company-integration audit trail. Mounted so an operator can `tail` it over SSH
      # instead of entering the container, and so it survives an image rebuild.
      - ./logs:/app/packages/backend/logs
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set a strong secret.}
      # Without this line the container never receives the variable and silently uses the code
      # default of 30 days, so setting it in .env would have no effect.
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-30}
      - DATABASE_PATH=${DATABASE_PATH:-/app/packages/backend/data/trindade.db}
      - PHOTOS_DIR=${PHOTOS_DIR:-/app/packages/backend/data/photos}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Same reason as REFRESH_TOKEN_TTL_DAYS: the code reads LOG_LEVEL and defaults to info.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Explicit rather than implicit: the service falls back to <cwd>/logs, and pinning it here
      # keeps the volume destination and the code in agreement if the workdir ever changes.
      - AERO_LOG_DIR=${AERO_LOG_DIR:-/app/packages/backend/logs}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.createConnection(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- Web Frontend (multi-stage build: Vite React app served via Nginx) ----
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_APP_BASE: ${VITE_APP_BASE:-/}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default
      - portafolio_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
    name: trindade_sqlite_data
    external: true

networks:
  default:
  portafolio_default:
    external: true
